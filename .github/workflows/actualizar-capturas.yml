name: Actualizar capturas de esquemáticos y placas

# Genera una captura SVG del esquemático y de la placa de la revisión activa
# de cada módulo, y las deja en docs/images/. También regenera la tabla de
# Bill of materials en docs/*.md (ver docs/generar_bom.py). Si se cambia la
# revisión activa de un módulo (por ejemplo ataconso rev-c -> rev-d), hay que
# actualizar las rutas de "paths" abajo, las llamadas a
# generar_esquematico/generar_placa, y MODULOS en docs/generar_bom.py.
on:
  push:
    branches:
      - main
    paths:
      - "ataconso/ataconso-v-0-rev-c/ataconso-v-0-rev-c.kicad_sch"
      - "ataconso/ataconso-v-0-rev-c/ataconso-v-0-rev-c.kicad_pcb"
      - "parla/parla-v-0-rev-c/parla-v-0-rev-c.kicad_sch"
      - "parla/parla-v-0-rev-c/parla-v-0-rev-c.kicad_pcb"
      - "relo/relo-v-0-rev-a/relo-v-0-rev-a.kicad_sch"
      - "relo/relo-v-0-rev-a/relo-v-0-rev-a.kicad_pcb"
      - "suma/suma-v-0-rev-a/suma-v-0-rev-a.kicad_sch"
      - "suma/suma-v-0-rev-a/suma-v-0-rev-a.kicad_pcb"
      # bloques/ son hojas jerárquicas que se insertan dentro de los .kicad_sch
      # de arriba: un cambio acá no toca esos archivos, pero sí cambia su BOM
      # aplanado y su esquemático renderizado, así que también dispara esto.
      - "bloques/**/*.kicad_sch"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    if: github.repository == 'piruetasxyz/popusintes-esquematicos-placas'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Generar capturas con kicad-cli
        run: |
          set -eu

          KICAD_IMG="kicad/kicad:10.0"
          docker pull "$KICAD_IMG"
          KICAD="docker run --rm --user $(id -u):$(id -g) -e HOME=/tmp -v ${PWD}:/work -w /work $KICAD_IMG kicad-cli"

          mkdir -p docs/images
          TMPDIR_REL="_captura_tmp"
          rm -rf "$TMPDIR_REL"

          generar_esquematico () {
            modulo="$1"
            entrada="$2"
            outdir="$TMPDIR_REL/$modulo"
            mkdir -p "$outdir"
            $KICAD sch export svg --output "$outdir" "$entrada"
            svg="$(find "$outdir" -maxdepth 1 -name '*.svg' | head -n1)"
            if [ -z "$svg" ]; then
              echo "No se generó SVG del esquemático para $modulo" >&2
              exit 1
            fi
            mv "$svg" "docs/images/${modulo}-esquematico.svg"
          }

          generar_placa () {
            modulo="$1"
            entrada="$2"
            $KICAD pcb export svg \
              --layers "F.Cu,F.Mask,F.Silkscreen,Edge.Cuts" \
              --mode-single \
              --output "docs/images/${modulo}-placa.svg" \
              "$entrada"
          }

          generar_esquematico ataconso ataconso/ataconso-v-0-rev-c/ataconso-v-0-rev-c.kicad_sch
          generar_placa       ataconso ataconso/ataconso-v-0-rev-c/ataconso-v-0-rev-c.kicad_pcb

          generar_esquematico parla parla/parla-v-0-rev-c/parla-v-0-rev-c.kicad_sch
          generar_placa       parla parla/parla-v-0-rev-c/parla-v-0-rev-c.kicad_pcb

          generar_esquematico relo relo/relo-v-0-rev-a/relo-v-0-rev-a.kicad_sch
          generar_placa       relo relo/relo-v-0-rev-a/relo-v-0-rev-a.kicad_pcb

          generar_esquematico suma suma/suma-v-0-rev-a/suma-v-0-rev-a.kicad_sch
          generar_placa       suma suma/suma-v-0-rev-a/suma-v-0-rev-a.kicad_pcb

          rm -rf "$TMPDIR_REL"

          # Reexportamos KICAD como KICAD_CLI para que generar_bom.py use el
          # mismo kicad-cli en docker, en vez de buscarlo en el PATH del runner.
          echo "KICAD_CLI=$KICAD" >> "$GITHUB_ENV"

      - name: Actualizar Bill of materials en docs/
        run: python3 docs/generar_bom.py

      - name: Commit y push de las capturas y BOM si cambiaron
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images docs/ataconso.md docs/parla.md docs/relo.md docs/suma.md
          if git diff --cached --quiet; then
            echo "Sin cambios en las capturas ni la BOM."
            exit 0
          fi
          git commit -m "Actualizar capturas y BOM de esquemáticos y placas [skip ci]"
          git push
