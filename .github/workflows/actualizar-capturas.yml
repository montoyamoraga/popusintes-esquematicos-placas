name: Actualizar capturas de esquemáticos y placas

# Genera una captura SVG del esquemático y de la placa de la revisión activa
# de cada módulo, las deja en docs/images/ y regenera la tabla de Bill of
# materials en docs/*.md, usando kicad-retrata
# (https://github.com/piruetasxyz/kicad-retrata). Los módulos y su revisión
# activa se configuran en kicad-retrata.yml, en la raíz del repositorio.
#
# El nombre de este workflow lo usa desplegar-paginas.yml en "workflow_run":
# si se cambia acá, hay que cambiarlo allá también.
on:
  push:
    branches:
      - main
    # GitHub no puede leer las rutas desde kicad-retrata.yml, así que se
    # escucha cualquier cambio de KiCad; si no cambia nada en las revisiones
    # activas, kicad-retrata no hace commit.
    paths:
      - "**/*.kicad_sch"
      - "**/*.kicad_pcb"
      - "kicad-retrata.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    if: github.repository == 'piruetasxyz/popusintes-esquematicos-placas'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Retratar con kicad-retrata
        uses: piruetasxyz/kicad-retrata@v0.0.1
